/* KB EDITOR — dark, Photoshop-class UI. Mobile-first aware, desktop default. */

:root {
  --bg: #1b1b1c;
  --panel: #262628;
  --panel-2: #2b2b2d;
  --panel-3: #2f2f31;
  --panel-4: #242425;
  --raised: #39393e;
  --raised-hover: #45454c;
  --border: #17171a;
  --border-soft: #3a3a3e;
  --text: #d8d8de;
  --dim: #9a9aa2;
  --accent: #2f8cff;
  --accent-hover: #4d9dff;
  --accent-soft: rgba(47, 140, 255, 0.16);
  --danger: #ff5f57;
  --radius: 8px;
  --topbar-h: 42px;
  --options-h: 36px;
  --status-h: 26px;
  --dock-w: 272px;
  --rail-w: 48px;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: var(--bg); color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
}
body { display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #44444a; border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

/* ═══════════ TOP BAR ═══════════ */
#topbar {
  height: var(--topbar-h); flex: 0 0 var(--topbar-h);
  display: flex; align-items: center; gap: 2px;
  background: var(--panel-4); border-bottom: 1px solid var(--border);
  padding: 0 8px calc(0px + env(safe-area-inset-right)) env(safe-area-inset-left);
  padding-left: max(8px, env(safe-area-inset-left));
  padding-right: max(8px, env(safe-area-inset-right));
  position: relative; z-index: 1200; user-select: none;
}
#brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; padding: 0 10px 0 2px; flex: 0 0 auto; }
#brandMark { display: block; filter: drop-shadow(0 1px 4px rgba(47,140,255,.35)); }
.wordmark { font-size: 14px; letter-spacing: 0.14em; color: #ececf1; font-weight: 500; white-space: nowrap; }
.wordmark strong { font-weight: 800; color: #fff; }
#menuHost { display: flex; align-items: stretch; height: 100%; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
#menuHost::-webkit-scrollbar { display: none; }
.menu-btn { padding: 0 11px; color: var(--text); font-size: 12.5px; border-radius: 6px; white-space: nowrap; }
.menu-btn:hover, .menu-btn.open { background: var(--raised); color: #fff; }
#docTitleWrap { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font-size: 12px; padding: 0 12px; border-left: 1px solid var(--border-soft); margin-left: 4px; }
#topActions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; padding-left: 6px; }
.top-btn { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: 7px; color: var(--text); border: 1px solid transparent; }
.top-btn svg { width: 17px; height: 17px; }
.top-btn:hover { background: var(--raised); color: #fff; }
.top-btn-primary { background: var(--accent); border-color: #1c6fd6; color: #fff; font-weight: 650; padding: 0 12px; }
.top-btn-primary:hover { background: var(--accent-hover); color: #fff; }
.top-btn-primary.attention { box-shadow: 0 0 0 2px rgba(47,140,255,.35), 0 2px 10px rgba(47,140,255,.4); }

/* ═══════════ OPTIONS BAR ═══════════ */
#optionsBar {
  min-height: var(--options-h); flex: 0 0 auto;
  display: flex; align-items: center; gap: 14px;
  background: var(--panel-2); border-bottom: 1px solid var(--border);
  padding: 3px 10px; overflow-x: auto; scrollbar-width: thin; white-space: nowrap;
  padding-left: max(10px, env(safe-area-inset-left));
  padding-right: max(10px, env(safe-area-inset-right));
}
.opt-group { display: flex; align-items: center; gap: 12px; }
.opt-field { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.opt-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
.opt-field input[type="range"] { width: 120px; accent-color: var(--accent); }
.opt-value { min-width: 40px; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.opt-num { width: 62px; background: #1f1f21; border: 1px solid var(--border-soft); color: var(--text); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
.opt-text { background: #1f1f21; border: 1px solid var(--border-soft); color: var(--text); border-radius: 6px; padding: 4px 8px; min-width: 160px; }
.opt-select { background: #1f1f21; border: 1px solid var(--border-soft); color: var(--text); border-radius: 6px; padding: 4px 6px; max-width: 230px; font-size: 12px; }
.opt-check { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--text); font-size: 12px; user-select: none; }
.opt-check input { accent-color: var(--accent); width: 15px; height: 15px; }
.opt-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; background: var(--raised); border-radius: 6px; border: 1px solid transparent; font-size: 12px; }
.opt-btn:hover { background: var(--raised-hover); color: #fff; }
.opt-btn svg { width: 14px; height: 14px; }
.opt-btn.opt-accent { background: var(--accent); color: #fff; border-color: #1c6fd6; }
.opt-btn.opt-accent:hover { background: var(--accent-hover); }
.opt-toggle.on { background: var(--accent-soft); border-color: var(--accent); color: #7db8ff; }

/* ═══════════ WORKSPACE ═══════════ */
#workspace { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }

/* ---- tool rail ---- */
#toolRail {
  width: var(--rail-w); flex: 0 0 var(--rail-w);
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  z-index: 1100; padding-bottom: env(safe-area-inset-bottom);
}
#toolButtons { display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; width: 100%; align-items: center; overflow-y: auto; scrollbar-width: none; }
#toolButtons::-webkit-scrollbar { display: none; }
.tool-btn {
  position: relative; width: 40px; height: 40px; flex: 0 0 auto;
  border-radius: var(--radius); color: #b7b7bf;
  display: flex; align-items: center; justify-content: center;
}
.tool-btn svg { width: 20px; height: 20px; }
.tool-btn:hover { background: var(--raised); color: #fff; }
.tool-btn.active { background: var(--accent-soft); color: #6cb2ff; box-shadow: inset 0 0 0 1.5px var(--accent); }
.tool-key { position: absolute; right: 3px; bottom: 2px; font-size: 8px; color: #6d6d75; text-transform: uppercase; pointer-events: none; }
.tool-btn.active .tool-key { color: #6cb2ff; }

/* swatches */
#swatches { margin-top: auto; padding: 6px 0 10px; }
.swatch-stack { position: relative; width: 40px; height: 44px; }
.swatch { position: absolute; width: 25px; height: 25px; border-radius: 5px; border: 1.5px solid #111; box-shadow: 0 0 0 1px #4a4a50; }
.swatch-fg { left: 1px; top: 1px; z-index: 2; background: #111; }
.swatch-bg { right: 1px; bottom: 1px; z-index: 1; background: #fff; }
.swatch-mini { position: absolute; width: 15px; height: 15px; z-index: 3; color: #cfcfd6; padding: 0; }
.swatch-mini svg { width: 100%; height: 100%; }
.swatch-mini:hover { color: #fff; transform: scale(1.15); }
.swatch-swap { right: -3px; top: -5px; }
.swatch-reset { left: -4px; bottom: -5px; }

/* ---- canvas area ---- */
#canvasArea { flex: 1 1 auto; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--bg); }
#view { position: absolute; inset: 0; display: block; touch-action: none; }
#rulerTop { position: absolute; top: 0; left: 22px; z-index: 4; pointer-events: auto; }
#rulerLeft { position: absolute; top: 22px; left: 0; z-index: 4; }
#rulerCorner { position: absolute; top: 0; left: 0; width: 22px; height: 22px; z-index: 5; background: #2c2c2e; border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
#brushCursor {
  position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; display: none;
  border-radius: 50%; border: 1.4px solid #fff; box-shadow: 0 0 0 1.2px rgba(0,0,0,0.75), inset 0 0 0 1.2px rgba(0,0,0,0.75);
}
.kb-type-input {
  position: absolute; z-index: 20; background: rgba(20,20,22,0.25); border: 1.5px dashed var(--accent);
  color: currentColor; outline: none; resize: none; padding: 2px 4px; line-height: 1.25;
  min-width: 120px; max-width: 90%; font-family: inherit; overflow: hidden; white-space: pre;
}

/* ---- right dock ---- */
#dock {
  width: var(--dock-w); flex: 0 0 var(--dock-w);
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 1050; min-height: 0;
}
#dock.hidden-panels { display: none; }
#dockTabs { display: flex; flex: 0 0 38px; border-bottom: 1px solid var(--border); align-items: stretch; }
.dock-tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  border-bottom: 2px solid transparent;
}
.dock-tab svg { width: 16px; height: 16px; }
.dock-tab:hover { color: var(--text); }
.dock-tab.active { color: #fff; border-bottom-color: var(--accent); background: rgba(47,140,255,0.06); }
#dockClose { display: none; width: 40px; color: var(--dim); }
#dockClose:hover { color: #fff; }
#dockClose svg { width: 18px; height: 18px; margin: auto; }
.dock-page { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
.dock-page.active { display: flex; }

#layerControls { padding: 8px 10px 6px; border-bottom: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 7px; }
#blendSelect { width: 100%; text-transform: capitalize; }
.opacity-wrap { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
.opacity-wrap label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
.opacity-wrap input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 0; }
#opacityValue { min-width: 38px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }

#layerList { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
.layer-row {
  display: flex; align-items: center; gap: 7px; padding: 4px 6px;
  border-bottom: 1px solid #2d2d2f; cursor: default; user-select: none; min-height: 48px;
}
.layer-row:hover { background: #2d2d2f; }
.layer-row.active { background: var(--accent-soft); box-shadow: inset 2.5px 0 0 var(--accent); }
.layer-eye { width: 26px; height: 26px; flex: 0 0 26px; color: var(--dim); display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.layer-eye svg { width: 17px; height: 17px; }
.layer-eye:hover { color: #fff; background: var(--raised); }
.layer-row.active .layer-eye { color: #8ec1ff; }
.layer-thumb { flex: 0 0 auto; border-radius: 4px; border: 1px solid #43434a; background: #555; width: 52px; height: 40px; }
.layer-meta { flex: 1 1 auto; min-width: 0; }
.layer-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; border-radius: 3px; padding: 1px 2px; }
.layer-row.active .layer-name { color: #fff; }
.layer-rename { width: 100%; font-size: 12px; background: #1c1c1e; color: #fff; border: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px; }
.layer-sub { font-size: 9.5px; color: var(--dim); text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer-mask { flex: 0 0 auto; border: 1px solid #43434a; border-radius: 4px; padding: 0; overflow: hidden; line-height: 0; }
.layer-mask.editing { outline: 2px solid var(--accent); outline-offset: 1px; }
.layer-reorder { display: flex; flex-direction: column; gap: 2px; opacity: 0; transition: opacity .15s; }
.layer-row:hover .layer-reorder, .layer-row:focus-within .layer-reorder, .layer-row.active .layer-reorder { opacity: 1; }
@media (hover: none) { .layer-reorder { opacity: 0.75; } }
.reorder-btn { width: 22px; height: 18px; color: var(--dim); border-radius: 4px; }
.reorder-btn svg { width: 14px; height: 14px; }
.reorder-btn:hover { color: #fff; background: var(--raised); }

#layerActions { flex: 0 0 40px; display: flex; border-top: 1px solid var(--border); }
.layer-action { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); }
.layer-action svg { width: 18px; height: 18px; }
.layer-action:hover { color: #fff; background: var(--raised); }
.layer-action-danger:hover { color: #ff7a72; background: rgba(255,95,87,.12); }

.history-note { padding: 8px 12px; font-size: 10.5px; color: var(--dim); border-bottom: 1px solid var(--border-soft); }
#historyList { flex: 1; overflow-y: auto; padding: 4px; }
.history-row { display: block; width: 100%; text-align: left; padding: 6px 10px; border-radius: 6px; color: var(--text); font-size: 12px; }
.history-row:hover { background: var(--raised); }
.history-row.head { color: #8ec1ff; font-weight: 650; border-top: 1px solid var(--border-soft); margin-top: 2px; padding-top: 8px; border-radius: 0; }

/* ═══════════ STATUS BAR ═══════════ */
#statusbar {
  height: var(--status-h); flex: 0 0 var(--status-h);
  display: flex; align-items: center; gap: 12px;
  background: var(--panel-4); border-top: 1px solid var(--border);
  font-size: 10.5px; color: var(--dim);
  padding: 0 8px; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right));
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(var(--status-h) + env(safe-area-inset-bottom));
  user-select: none;
}
.status-group { display: flex; align-items: center; gap: 2px; }
.status-btn { width: 22px; height: 20px; border-radius: 4px; color: var(--dim); font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.status-btn-wide { width: auto; padding: 0 7px; font-size: 10px; }
.status-btn:hover { background: var(--raised); color: #fff; }
#zoomLabel { min-width: 42px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
.status-center { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-right { white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ═══════════ MENUS ═══════════ */
.menu-dropdown {
  position: fixed; z-index: 3000; min-width: 224px; max-width: min(320px, 92vw);
  background: #2e2e30; border: 1px solid #1a1a1d; border-radius: 9px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
  padding: 5px; animation: menuIn .12s ease-out;
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 10px 6px 6px; border-radius: 6px; text-align: left; font-size: 12.5px; color: var(--text);
}
.menu-item:hover { background: var(--accent); color: #fff; }
.menu-item:hover .menu-kbd, .menu-item:hover .menu-check { color: rgba(255,255,255,.85); }
.menu-item.disabled { opacity: 0.35; pointer-events: none; }
.menu-check { flex: 0 0 16px; text-align: center; color: var(--accent); font-size: 12px; }
.menu-label { flex: 1; white-space: nowrap; }
.menu-kbd { color: var(--dim); font-size: 10px; font-family: inherit; }
.menu-caret { color: var(--dim); font-size: 11px; }
.menu-sep { height: 1px; background: #404046; margin: 4px 8px; }
.menu-sub { z-index: 3100; }

/* ═══════════ DIALOGS ═══════════ */
#dialogRoot:empty { display: none; }
.dialog-overlay { position: fixed; inset: 0; z-index: 4000; background: rgba(12,12,15,0.6); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 12px; animation: fadeIn .15s ease-out; }
@keyframes fadeIn { from { opacity: 0; } }
.dialog { background: #2f2f31; border: 1px solid #191920; border-radius: 12px; box-shadow: 0 24px 80px rgba(0,0,0,.6); max-height: calc(100vh - 32px); overflow-y: auto; animation: dialogIn .18s cubic-bezier(.2,1.4,.4,1); }
@keyframes dialogIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
.dialog-titlebar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
.dialog-title { font-size: 13.5px; font-weight: 700; color: #fff; letter-spacing: 0.01em; }
.dialog-x { width: 28px; height: 28px; border-radius: 6px; color: var(--dim); display: flex; align-items: center; justify-content: center; }
.dialog-x:hover { background: var(--raised); color: #fff; }
.dialog-x svg { width: 16px; height: 16px; }
.dialog-body { padding: 12px 14px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 14px 13px; }
.dialog-btn { padding: 7px 16px; border-radius: 7px; background: var(--raised); font-size: 12.5px; }
.dialog-btn:hover { background: var(--raised-hover); color: #fff; }
.dialog-ok { background: var(--accent); color: #fff; font-weight: 650; border: 1px solid #1c6fd6; }
.dialog-ok:hover { background: var(--accent-hover); color: #fff; }
.dialog-danger { background: #c9403a; border: 1px solid #a03028; color: #fff; }
.dialog-danger:hover { background: #e0564f; color: #fff; }
.dialog-message { margin: 2px 0 0; color: var(--text); font-size: 12.5px; line-height: 1.5; }

#toast {

@keyframes kbLoad { 0% { transform: translateX(-110%); } 60%, 100% { transform: translateX(280%); } }
.loading-tip { color: var(--text); margin: 0; font-size: 12px; }

  <script>
    // Boot watchdog: if the module graph fails before js/app.js runs, the loading
    // screen would hang forever. Turn that into a visible, actionable error.
    (function () {
      var showFatal = function (msg) {
        var fatal = document.getElementById('fatal');
        if (!fatal) return;
        var d = document.getElementById('fatalDetail');
        if (d && msg) d.textContent = String(msg).slice(0, 300);
        fatal.hidden = false;
      };
      window.__KB_FATAL__ = showFatal;
      window.addEventListener('error', function (e) {
        var msg = (e && e.error && e.error.message) || (e && e.message);
        if (msg) showFatal(msg);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        showFatal((r && r.message) || r || 'Unexpected error');
      });
      window.__KB_BOOT_TIMER__ = setTimeout(function () {
        if (!window.__KB_BOOTED__) {
          showFatal('KB EDITOR did not finish starting. This is usually a stale cached file — reload with Ctrl+F5 (Windows/Linux) or Cmd+Shift+R (Mac). If it keeps happening, check the browser console for the exact module that failed.');
        }
      }, 8000);
    })();
  </script>
